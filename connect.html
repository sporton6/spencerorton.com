  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Nunito+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <!-- Thin floating header -->
  <header class="site-header" id="site-header">
    <a class="brand" href="index.html">Spencer Orton</a>
    <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="menu-overlay">
      <span></span><span></span>
    </button>
  </header>

  <!-- Full-screen menu overlay -->
  <div class="menu-overlay" id="menu-overlay" aria-hidden="true">
    <div class="menu-overlay-top">
      <span class="menu-name">Spencer Orton</span>
      <button class="menu-close" id="menu-close" aria-label="Close menu">×</button>
    </div>
    <nav class="menu-nav" aria-label="Main">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="headshot-resume.html">H + R</a></li>
        <li><a href="media.html">Media</a></li>
        <li><a href="connect.html" aria-current="page">Connect</a></li>
      </ul>
    </nav>
  </div>

  <main id="main" class="page connect-page">
    <section class="section band-light connect-section">
      <div class="wrap">
        <h1 id="page-h" class="connect-heading">Let's Connect!</h1>

        <!-- Contact form -->
        <form class="connect-form" id="connect-form" action="https://formspree.io/f/your-form-id" method="POST">
          <input type="hidden" name="_subject" value="New inquiry from spencerorton.com">
          <input type="hidden" name="_to" value="smuhlbauer6@gmail.com">
          <div class="form-row">
            <div class="form-field">
              <label for="first-name">First Name <span class="req">(required)</span></label>
              <input type="text" id="first-name" name="first_name" required autocomplete="given-name">
            </div>
            <div class="form-field">
              <label for="last-name">Last Name <span class="req">(required)</span></label>
              <input type="text" id="last-name" name="last_name" required autocomplete="family-name">
            </div>
          </div>
          <div class="form-field">
            <label for="email">Email <span class="req">(required)</span></label>
            <input type="email" id="email" name="email" required autocomplete="email">
          </div>
          <div class="form-field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" autocomplete="tel">
          </div>
          <div class="form-field">
            <label for="message">Message <span class="req">(required)</span></label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn-submit">SUBMIT</button>
          <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- Footer with soft blue-to-navy gradient -->
  <footer class="site-footer footer-gradient" aria-labelledby="contact-h">
    <div class="wrap">
      <h2 id="contact-h" class="footer-name">Spencer Orton</h2>
      <p class="footer-url">www.spencerorton.com</p>
      <div class="footer-contact">
        <div>
          <h3>Contact</h3>
          <p><a href="mailto:smuhlbauer6@gmail.com">smuhlbauer6@gmail.com</a></p>
        </div>
      </div>
      <p class="credits">Photos by Samper Images, Matthew Jorstad Photography.</p>
      <p class="credits">© <span data-year>2026</span> Spencer Orton</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
